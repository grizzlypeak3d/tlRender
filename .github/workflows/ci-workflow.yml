      TLRENDER_QT5: OFF
      TLRENDER_PYTHON: ON
      TLRENDER_PROGRAMS: ON
      TLRENDER_EXAMPLES: ON
      TLRENDER_TESTS: ON
      BUILD_SHARED_LIBS: OFF
      FTK_API: GL_4_1

    steps:
    - uses: actions/checkout@v6
      with:
        path: tl
        submodules: recursive
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - uses: ilammy/setup-nasm@v1

    # \bug Any spaces before the ">>" will be considered part of the path.
    - name: Setup environment
      shell: cmd
      run: |
        echo %CD%\install-Debug\bin>> %GITHUB_PATH%
        echo %CD%\install-Debug\lib>> %GITHUB_PATH%
        echo CTEST_OUTPUT_ON_FAILURE=1 >> %GITHUB_ENV%
        cmake --version
        python --version
        
    - name: Build tlRender
      shell: cmd
      run: |
        tl\etc\Windows\sbuild.bat tl Debug

    # \bug Disable tests since Windows CI doesn't work with OpenGL?
    #- name: Run tests
