        cmake --version
        python --version
        sh tl/etc/Linux/setup-gha.sh lcov

    - name: Build tlRender
      run: |
        sh tl/etc/Linux/sbuild.sh tl Debug ci-linux-python

    - name: Run tests
      run: |
        cd build-Debug
        xvfb-run ctest --verbose --rerun-failed --output-on-failure -C Debug
    
    - name: Code coverage
      run: |
        cd build-Debug
        sh ../tl/etc/Linux/lcov.sh
