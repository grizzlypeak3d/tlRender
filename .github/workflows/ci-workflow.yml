        echo CTEST_OUTPUT_ON_FAILURE=1 >> %GITHUB_ENV%
        cmake --version
        python --version
        
    - name: Build tlRender
      shell: cmd
      run: |
        tl\etc\Windows\sbuild.bat tl Debug ci-windows-python

    # The runner has no working OpenGL; ci-windows.cmake leaves out the tests
    # that make a context.
    - name: Run tests
      shell: cmd
      run: |
        cd build-Debug
        ctest --verbose --rerun-failed --output-on-failure -C Debug