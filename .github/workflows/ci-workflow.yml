name: CI

on: [push]

jobs:
  linux-build:
    runs-on: ubuntu-latest

    env:
      JOBS: 4
      TLRENDER_NET: OFF
      TLRENDER_OCIO: ON
      TLRENDER_JPEG: ON
      TLRENDER_TIFF: ON
      TLRENDER_EXR: ON
      TLRENDER_AOM: ON
      TLRENDER_SVTAV1: ON
      TLRENDER_FFMPEG: ON
      TLRENDER_FFMPEG_MINIMAL: OFF
      TLRENDER_FFMPEG_PLUGIN: ON
      TLRENDER_FFMPEG_CMD: OFF
      TLRENDER_NASM: ON
      TLRENDER_OIIO: ON
      TLRENDER_USD: OFF
      TLRENDER_QT6: ON
      TLRENDER_QT5: OFF
      TLRENDER_PYTHON: ON
      TLRENDER_PROGRAMS: ON
      TLRENDER_EXAMPLES: ON
      TLRENDER_TESTS: ON
      TLRENDER_GCOV: ON
      FTK_API: GL_4_1
      BUILD_SHARED_LIBS: OFF

    steps:
    - uses: actions/checkout@v6
      with:
        path: tl
        submodules: recursive
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Setup environment
      run: |
        echo "$PWD/install-Debug/bin" >> $GITHUB_PATH
        echo "LD_LIBRARY_PATH=$PWD/install-Debug/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
        echo "PYTHONPATH=$PWD/install-Debug/lib:$PYTHONPATH" >> $GITHUB_ENV
        cmake --version
        python --version
        sh tl/etc/Linux/setup-gha.sh

    - name: Build tlRender
      run: |
        sh tl/etc/Linux/sbuild.sh tl Debug

    - name: Run tests
      run: |
        cd build-Debug
        xvfb-run ctest --verbose --rerun-failed --output-on-failure -C Debug
    
    - name: Code coverage
      if: env.TLRENDER_GCOV == 'ON'
      run: |
        cd build-Debug
        sh ../tl/etc/Linux/lcov.sh

