    - name: Setup environment
      run: |
        echo "$PWD/install-Release/bin" >> $GITHUB_PATH
        echo "LD_LIBRARY_PATH=$PWD/install-Release/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
        echo "PYTHONPATH=$PWD/install-Release/lib:$PYTHONPATH" >> $GITHUB_ENV
        cmake --version
        python --version
        sh tl/etc/Linux/setup-gha.sh

    - name: Build tlRender
      run: |
        sh tl/etc/Linux/sbuild.sh tl Release

    - name: Package
      run: |
        cmake --build build-Release -j 4 --target package

    - uses: actions/upload-artifact@v7
      with:
        name: tlRender-Linux-Packages
        path: build-Release/tlRender-*.tar.gz
        archive: false

  macos-build:
    runs-on: macos-latest

    env:
      JOBS: 4
      TLRENDER_NET: OFF
      TLRENDER_OCIO: ON
      TLRENDER_JPEG: ON
      TLRENDER_TIFF: ON
      TLRENDER_EXR: ON
      TLRENDER_AOM: ON
      TLRENDER_SVTAV1: ON
      TLRENDER_FFMPEG: ON
      TLRENDER_FFMPEG_MINIMAL: OFF
      TLRENDER_FFMPEG_PLUGIN: ON
      TLRENDER_FFMPEG_CMD: OFF
      TLRENDER_NASM: ON
      TLRENDER_OIIO: ON
      TLRENDER_USD: OFF
      TLRENDER_QT6: OFF
      TLRENDER_QT5: OFF
      TLRENDER_PYTHON: ON
      TLRENDER_PROGRAMS: ON
      TLRENDER_EXAMPLES: ON
      TLRENDER_TESTS: ON
      TLRENDER_GCOV: OFF
      FTK_API: GL_4_1
      BUILD_SHARED_LIBS: OFF
      CMAKE_OSX_DEPLOYMENT_TARGET: 14
      CMAKE_OSX_ARCHITECTURES: arm64

    steps:
    - uses: actions/checkout@v6
      with:
        path: tl
        submodules: recursive
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    # \bug DYLD_LIBRARY_PATH is not being set here?
    - name: Setup environment
      run: |
        echo "$PWD/install-Debug/bin" >> $GITHUB_PATH
        echo "DYLD_LIBRARY_PATH=$PWD/install-Debug/lib:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV
        echo "PYTHONPATH=$PWD/install-Debug/lib:$PYTHONPATH" >> $GITHUB_ENV
        cmake --version
        python --version

    - name: Build tlRender
      run: |
        export DYLD_LIBRARY_PATH=$PWD/install-Debug/lib:$DYLD_LIBRARY_PATH
        sh tl/etc/macOS/sbuild.sh tl Debug

    # \bug Disable tests since macOS CI doesn't work with OpenGL?
    #- name: Run tests
    #  run: |
    #    export DYLD_LIBRARY_PATH=$PWD/install-Debug/lib:$DYLD_LIBRARY_PATH
    #    cd build-Debug
    #    ctest --verbose --rerun-failed --output-on-failure -C Debug

  macos-package:
    runs-on: macos-latest

    env:
      JOBS: 4
      TLRENDER_NET: OFF
      TLRENDER_OCIO: ON
      TLRENDER_JPEG: ON
      TLRENDER_TIFF: ON
      TLRENDER_EXR: ON
      TLRENDER_AOM: ON
      TLRENDER_SVTAV1: ON
      TLRENDER_FFMPEG: ON
      TLRENDER_FFMPEG_MINIMAL: ON
      TLRENDER_FFMPEG_PLUGIN: OFF
      TLRENDER_FFMPEG_CMD: ON
      TLRENDER_NASM: ON
      TLRENDER_OIIO: ON
      TLRENDER_USD: OFF
      TLRENDER_QT6: OFF
      TLRENDER_QT5: OFF
      TLRENDER_PYTHON: ON
      TLRENDER_PROGRAMS: ON
      TLRENDER_EXAMPLES: OFF
      TLRENDER_TESTS: OFF
      BUILD_SHARED_LIBS: OFF
      FTK_API: GL_4_1
      CMAKE_OSX_DEPLOYMENT_TARGET: 10.15
      CMAKE_OSX_ARCHITECTURES: arm64

    steps:
    - uses: actions/checkout@v6
      with:
        path: tl
        submodules: recursive
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    # \bug DYLD_LIBRARY_PATH is not being set here?
    - name: Setup environment
      run: |
        echo "$PWD/install-Release/bin" >> $GITHUB_PATH
        echo "DYLD_LIBRARY_PATH=$PWD/install-Release/lib:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV
        echo "PYTHONPATH=$PWD/install-Release/lib:$PYTHONPATH" >> $GITHUB_ENV
        cmake --version
        python --version

    - name: Build tlRender
      run: |
        export DYLD_LIBRARY_PATH=$PWD/install-Release/lib:$DYLD_LIBRARY_PATH
        sh tl/etc/macOS/sbuild.sh tl Release

    # \bug Sometimes the CI runs out of disk space when building the macOS
    # package, so free some up by removing the super build directory.
    - name: Package
      run: |
        export DYLD_LIBRARY_PATH=$PWD/install-Release/lib:$DYLD_LIBRARY_PATH
        rm -rf sbuild-Release
        cmake --build build-Release -j 4 --target package

    - uses: actions/upload-artifact@v7
      with:
        name: tlRender-macOS-Packages
        path: build-Release/tlRender-*.dmg
        archive: false

