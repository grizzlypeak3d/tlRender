      BUILD_SHARED_LIBS: OFF
      FTK_API: GL_4_1

    steps:
    - uses: actions/checkout@v6
      with:
        path: tl
        submodules: recursive
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - uses: ilammy/setup-nasm@v1

    # \bug Any spaces before the ">>" will be considered part of the path.
    - name: Setup environment
      shell: cmd
      run: |
        echo %CD%\build-Release\bin>> %GITHUB_PATH%
        echo %CD%\build-Release\lib>> %GITHUB_PATH%
        echo CTEST_OUTPUT_ON_FAILURE=1 >> %GITHUB_ENV%
        cmake --version
        python --version

    - name: Build tlRender
      shell: cmd
      run: |
        tl\etc\Windows\sbuild.bat tl Release

    - name: Package
      shell: cmd
      run: |
        cmake --build build-Release -j 4 --config Release --target package

    - uses: actions/upload-artifact@v7
      with:
        name: tlRender-Windows-Packages
        path: build-Release\tlRender-*.zip
        archive: false
