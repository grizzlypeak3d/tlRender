[build-system]
# feather-tk is pinned to one release, here and in the dependencies below:
# the module is built against that wheel's headers and loads its libraries.
# A tlRender release needs the feather-tk it was built with on PyPI first.
# nanobind is the version feather-tk's module is built with; the two share
# types only when they match.
requires = [
    "scikit-build-core>=0.11",
    "nanobind==3.0.1",
    "feather-tk==0.14.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "tlRender"
dynamic = ["version"]
description = "A library for building playback and review applications for film, VFX, and animation"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt", "etc/Legal/LICENSE_*"]
authors = [{ name = "Contributors to the tlRender project" }]
keywords = ["vfx", "animation", "playback", "review", "opentimelineio", "ffmpeg"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Graphics :: Viewers",
    "Topic :: Multimedia :: Video :: Display",
]
dependencies = [
    "feather-tk==0.14.0",
    "opentimelineio>=0.18",
]

[project.urls]
Homepage = "https://github.com/grizzlypeak3d/tlRender"
Source = "https://github.com/grizzlypeak3d/tlRender"
Issues = "https://github.com/grizzlypeak3d/tlRender/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.31"
# Kept between builds, so the dependencies the configure step builds (see
# etc/Python/tlWheelDeps.cmake) are built once per platform.
build-dir = "build-wheel/{wheel_tag}"
# One wheel for every CPython from 3.12 on.
wheel.py-api = "cp312"
# The wheel's contents come from the CMake install: the package directory
# is the install prefix, so the module, the libraries, the headers and the
# CMake package all land inside tlrender.
wheel.install-dir = "tlrender"
wheel.packages = []
sdist.exclude = [".github", "build-wheel", "dist"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "lib/tlRender/Core/Version.h"
regex = '''(?s)TLRENDER_VERSION_MAJOR (?P<major>\d+).*TLRENDER_VERSION_MINOR (?P<minor>\d+).*TLRENDER_VERSION_PATCH (?P<patch>\d+).*TLRENDER_VERSION_DEV "(?P<dev>[^"]*)"'''
# "0.21.0-dev" normalizes to the PEP 440 "0.21.0.dev0".
result = "{major}.{minor}.{patch}{dev}"

[tool.cibuildwheel]
build = "cp312-*"
skip = "*-musllinux_*"
# Each runner builds its own architecture only; "auto" adds 32-bit Windows
# and Linux, which are not supported.
archs = ["native"]
build-verbosity = 1
# The runners have no OpenGL; the tests that need it skip. After them, a C++
# program is built against the installed wheels with cmake from pip, which
# checks that the CMake packages in them name their own files.
test-requires = ["cmake"]
test-command = "python {project}/tests/run-python-tests.py && python {project}/tests/wheel-consumer/check.py"
test-environment = { TLRENDER_TESTS_NO_GL = "1" }
# feather-tk's libraries stay in the feather-tk wheel; the script shows the
# repair tools where they are and has them left out (see its comment).
repair-wheel-command = "python {project}/etc/Python/repair_wheel.py {wheel} {dest_dir}"

[tool.cibuildwheel.linux]
# OpenGL for the GL library, and patchelf for etc/Python/fix_rpaths.py.
# The images are AlmaLinux 8.
before-all = "dnf install -y mesa-libGL-devel mesa-libEGL-devel patchelf"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }
repair-wheel-command = "python {project}/etc/Python/repair_wheel.py {wheel} {dest_dir} {delocate_archs}"
